name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment runs at a time; a push while one is in flight
# waits for it rather than racing it, but never cancels a deploy that's
# already partway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Same checks as ci.yml's web job — a broken build should never reach
      # Pages just because this workflow runs independently of that one.
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run test
        working-directory: web
      # Reads the repo's configured Pages settings (must be enabled once via
      # Settings > Pages > Source > GitHub Actions) and outputs base_path —
      # "/" for a custom domain or a user/org page, "/<repo-name>/" for a
      # project page without one. vite.config.ts's `base` needs this to
      # generate correct asset URLs either way.
      #
      # Pinned to a version tag rather than a commit SHA like the actions
      # above, unlike this repo's usual convention (see ci.yml) — this was
      # written without the ability to verify the current commit SHA for
      # these three GitHub-owned actions. Dependabot (.github/dependabot.yml,
      # github-actions ecosystem) tracks this file and will still open
      # update PRs; consider pinning these to a verified SHA by hand next
      # time one lands, to match the rest of the repo.
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build
        working-directory: web
        env:
          # Must be set as a repository variable (Settings > Secrets and
          # variables > Actions > Variables > API_BASE_URL) pointing at the
          # deployed server's public URL — see the README's deployment guide.
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
